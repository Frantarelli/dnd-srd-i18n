name: Validar traducciones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Validar todas las traducciones
        run: npm run check
      - name: Que no haya traducciones viejas respecto del inglés
        run: npm run stale
      - name: Pruebas de las herramientas
        run: npm test
